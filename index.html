<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payoff</title>
<meta name="description" content="A private budget and debt payoff app for two.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1718">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" id="touchIcon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Payoff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
/* ============ themes ============ */
:root{--r:18px;--nav-h:70px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
body.t-eth{
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --bg:#0A1718;--surface:#102326;--surface2:#15302F;--ink:#E9F3F1;--ink2:#A9C1BE;--muted:#6F8987;--line:#1F3B3E;--line2:#173134;
  --accent:#52C7BA;--accent-ink:#04201E;--accent-soft:#123F3D;
  --amber:#E8B860;--amber-soft:#3A2F15;--red:#F3897C;--red-soft:#47211C;--green:#7FD89E;--green-soft:#163926;
  --c-ethan:#B3A6F7;--c-ethan-soft:#28254A;--c-oakley:#8DB6DF;--c-oakley-soft:#1B2F43;--c-savings:#E8B860;--c-savings-soft:#3A2F15;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;color-scheme:dark}
body.t-oak{
  --display:'Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;
  --bg:#F2F6FA;--surface:#FFFFFF;--surface2:#F6F9FC;--ink:#25374A;--ink2:#56697E;--muted:#8A9BAE;--line:#E0E8F1;--line2:#EDF2F8;
  --accent:#5E85AC;--accent-ink:#FFFFFF;--accent-soft:#E1EBF5;--dusty:#7C9FC3;--dusty-2:#A7C0DA;--dusty-3:#DCE7F2;
  --amber:#A97B22;--amber-soft:#FBF0D9;--red:#BC5B4B;--red-soft:#FBE5E0;--green:#3F8C66;--green-soft:#E1F2E8;
  --c-ethan:#7466C0;--c-ethan-soft:#ECE9FB;--c-oakley:#4E7398;--c-oakley-soft:#E1EBF5;--c-savings:#A97B22;--c-savings-soft:#FBF0D9;
  --shadow:0 6px 22px rgba(70,105,140,.10),0 1px 3px rgba(70,105,140,.08);color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 30px + var(--sab));overscroll-behavior-y:none;transition:background .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
.num{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.sbar{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:35}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ header ============ */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--sat)) 0 4px}
.brand{font:800 21px/1 var(--display);letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.brand i{width:24px;height:24px;border-radius:8px;background:linear-gradient(140deg,#5FD2C4,#2A9C90);display:inline-grid;place-items:center}
.brand i:after{content:"";width:9px;height:9px;border:2.2px solid #06201F;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px)}
.top-r{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:transparent}
.status b{width:8px;height:8px;border-radius:50%;background:var(--green)}
.status.saving b{background:var(--amber);animation:pulse 1s infinite}
.status.offline b{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--ink2);padding:0}
.iconbtn.sm{width:34px;height:34px}

/* ============ generic ============ */
.sec{padding:22px 0 4px}
.sec.first{padding-top:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:12px}
.sec-h h2{font:700 21px/1.15 var(--display);letter-spacing:-.015em;margin:0}
.sec-h span{color:var(--ink2);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.note{font-size:14px;color:var(--ink2);margin:10px 0 0}
.note.warn{color:var(--amber)}.note.ok{color:var(--green)}.note.center{text-align:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line2);color:var(--ink2);white-space:nowrap;line-height:1.35}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:99px;white-space:nowrap;line-height:1.35}
.who:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.who.ethan{background:var(--c-ethan-soft);color:var(--c-ethan)}
.who.oakley{background:var(--c-oakley-soft);color:var(--c-oakley)}
.who.savings{background:var(--c-savings-soft);color:var(--c-savings)}
.gdot{width:9px;height:9px;border-radius:3px;background:var(--g);display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 16px;font-weight:700;font-size:14.5px;color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.block{width:100%;padding:13px}
.btn:active,.iconbtn:active{transform:scale(.97)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;font-size:14px}
.empty{padding:20px 4px;color:var(--ink2)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.pill b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:99px;padding:7px 13px;font-weight:700;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ============ plan (Ethan) ============ */
.period{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.period-t{text-align:center;line-height:1.2}
.period-t b{display:block;font:700 22px/1.1 var(--display);letter-spacing:-.015em}
.period-t span{font-size:13.5px;color:var(--ink2)}
.flag{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 12px;padding:10px 13px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--amber) 55%,transparent);background:var(--amber-soft);color:var(--amber);font-weight:700;font-size:14px;text-align:left}
.flag small{font-weight:500;opacity:.85;margin-left:auto;font-size:12.5px}
.sum-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sum-i{background:none;border:0;padding:0;text-align:left}
.sum-i span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.sum-i b{font:800 21px/1.15 var(--display);letter-spacing:-.01em}
.sum-i b.pos{color:var(--green)}.sum-i b.neg{color:var(--red)}
button.sum-i b{border-bottom:1.5px dashed var(--line)}
.segbar{display:flex;gap:3px;height:12px;margin:14px 0 10px;border-radius:99px;overflow:hidden;background:var(--line2)}
.segbar i{display:block;height:100%;border-radius:3px;min-width:3px;transition:flex .4s}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.bucket{margin-top:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.bk-h{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line2)}
.bk-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--bkc-soft);color:var(--bkc)}
.bk-t{flex:1;min-width:0}
.bk-t b{display:block;font-weight:700;font-size:16px}
.bk-t span{font-size:13px;color:var(--ink2)}
.bk-amt{font:800 22px/1 var(--display);letter-spacing:-.01em;color:var(--bkc)}
.bk-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bkc-soft) 45%,transparent);font-size:13.5px;color:var(--ink2)}
.bk-f .btn{border-color:color-mix(in srgb,var(--bkc) 40%,transparent);color:var(--bkc)}
.bk-f .btn.on{background:var(--bkc);color:var(--bg)}
.b-savings{--bkc:var(--c-savings);--bkc-soft:var(--c-savings-soft)}
.b-ethan{--bkc:var(--c-ethan);--bkc-soft:var(--c-ethan-soft)}
.b-oakley{--bkc:var(--c-oakley);--bkc-soft:var(--c-oakley-soft)}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li-main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.li-t{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:13px;color:var(--ink2);margin-top:3px}
.li-amt{font:700 16.5px/1 var(--body);text-align:right;white-space:nowrap}
.li.is-done .li-t,.li.is-done .li-amt{color:var(--muted)}
.li.is-done .li-amt{text-decoration:line-through;text-decoration-thickness:1.5px}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent;padding:0;transition:all .15s}
.tick svg{width:16px;height:16px;stroke-width:3}
.tick.on{background:var(--bkc,var(--green));border-color:var(--bkc,var(--green));color:var(--bg)}
.callout{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-top:12px}
.callout .ci{width:34px;height:34px;border-radius:11px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;flex:none}
.callout p{margin:0;flex:1;font-size:14px;color:var(--ink2)}
.callout p b{color:var(--ink)}

/* ============ budget ============ */
.grp{margin-top:16px}
.grp-h{display:flex;align-items:center;gap:9px;padding:0 2px 8px;font-weight:700;font-size:15px}
.grp-h .gdot{width:11px;height:11px}
.grp-h span:last-child{margin-left:auto;color:var(--ink2);font-weight:600;font-size:14px}
.grp .card{padding:0;overflow:hidden}
.bl{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line2);padding:13px 16px;text-align:left}
.bl:last-child{border-bottom:0}
.bl .main{flex:1;min-width:0}
.bl .t{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.bl .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .s{display:flex;flex-wrap:wrap;gap:4px 7px;align-items:center;font-size:13px;color:var(--ink2);margin-top:4px}
.bl .a{text-align:right;font:700 16.5px/1.1 var(--body);white-space:nowrap}
.bl .a small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.bl.paused{opacity:.6}
.upd{border:0;background:var(--amber-soft);color:var(--amber);font-weight:800;font-size:12px;border-radius:99px;padding:4px 10px}

/* ============ debts ============ */
.hero{padding:14px 0 6px}
.hero-k{margin:0 0 2px;color:var(--ink2);font-size:15px}
.hero-n{font:800 clamp(46px,13vw,66px)/1 var(--display);letter-spacing:-.03em;margin:0}
.hero-n small{font-size:.42em;color:var(--muted);letter-spacing:0;font-weight:500}
.stack{display:flex;gap:2px;height:20px;margin:18px 0 10px}
.stack button{border:0;padding:0;border-radius:6px;min-width:4px}
.hero-sub{margin:14px 0 0;font-size:16.5px;line-height:1.4}
.hero-sub b{font-weight:700}
.list{border-top:1px solid var(--line)}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 2px}
.item .l1{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.item .nm{font-weight:700;font-size:17px}
.item .ds{color:var(--ink2);font-size:14px;margin-left:6px;font-weight:400}
.item .bal{font:700 20px/1 var(--display);letter-spacing:-.01em}
.item .l2{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:9px;align-items:center;font-size:13.5px;color:var(--ink2)}
.bar{height:5px;border-radius:9px;background:var(--line2);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.chartbox{position:relative;margin-top:4px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:13px;line-height:1.3;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s;z-index:3}
.tip b{display:block;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line2);text-align:left}
table.t td:last-child,table.t th:last-child{text-align:right}

/* ============ nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(8px + var(--sab));pointer-events:none}
.nav-in{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;gap:2px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:18px;padding:7px 2px;font-weight:700;font-size:11.5px;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(140deg,#62D6C8,#2FA597);color:#04201E;justify-self:center;padding:0;justify-content:center;box-shadow:0 6px 18px rgba(82,199,186,.35)}
.nav .fab svg{width:26px;height:26px;stroke-width:2.4}

/* ============ sheets ============ */
.scrim{position:fixed;inset:0;background:rgba(3,12,14,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
body.t-oak .scrim{background:rgba(38,56,76,.35)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--sab));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet:before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:26px;padding-bottom:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet h3{font:800 23px/1.15 var(--display);margin:0 0 4px;letter-spacing:-.015em}
.sheet .sub{color:var(--ink2);margin:0 0 16px;font-size:14.5px}
.field{display:block;margin:0 0 13px;min-width:0}
.field>span{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.in{width:100%;min-width:0;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);font-size:16px;-webkit-appearance:none;appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date].in,input[type=time].in{min-height:47px}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.in.big{font:800 30px/1 var(--display);padding:14px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:13px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.12)}
.seg.who-seg{display:flex;flex-wrap:wrap}
.seg.who-seg button{flex:1 1 auto;padding:9px 10px;line-height:1.2}
.seg.who-seg button[aria-pressed="true"]{color:var(--wc)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;border-radius:13px;background:var(--bg);margin-bottom:13px}
.switch span{font-weight:700;font-size:15px}
.switch small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:1px}
.tgl{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tgl:checked{background:var(--accent)}
.tgl:checked:after{transform:translateX(20px)}
.switch.hot{background:var(--amber-soft)}
.switch.hot .tgl:checked{background:var(--amber)}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px;padding:12px 15px}
.acts.col{flex-direction:column}
.err{color:var(--red);font-size:14px;margin:0 0 10px;font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;margin:14px 0}
.facts div{background:var(--surface);padding:11px 13px}

<body class="t-eth">

<script>
'use strict';
/* =====================================================================
   Payoff v2 — budget + debt payoff for two.
   Front-end only; data lives in your Google Sheet via the Apps Script
   web app (Code.gs). Each phone keeps a sign-in token so you only type
   your password once.
   ===================================================================== */

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round(n * 100) / 100;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const ymd = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const addDays = (s, n) => { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const localYmd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => localYmd(new Date());
const money = (n, cents = true) => (n < -0.004 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', cents ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumFractionDigits: 0 });
const moneyC = n => Math.abs(n - Math.round(n)) < 0.005 ? money(n, false) : money(n, true);
const fmt = (s, o = { month: 'short', day: 'numeric' }) => pd(s).toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const fmtY = s => fmt(s, { month: 'short', day: 'numeric', year: 'numeric' });
const fmtMY = s => fmt(s, { month: 'short', year: 'numeric' });
const fmtWD = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtDT = iso => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtAt = iso => new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const ordinal = n => { const v = n % 100; return n + (['th', 'st', 'nd', 'rd'][(v - 20) % 10] || ['th', 'st', 'nd', 'rd'][v] || 'th'); };
const rel = (s, t) => { const d = diffDays(t, s); return d === 0 ? 'today' : d === 1 ? 'tomorrow' : d === -1 ? 'yesterday' : d > 0 ? `in ${d} days` : `${-d} days ago`; };
const parseMoney = v => { const n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isFinite(n) ? n : NaN; };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const svg = p => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  chev: svg('<path d="M6 9l6 6 6-6"/>'),
  left: svg('<path d="M15 18l-6-6 6-6"/>'),
  right: svg('<path d="M9 18l6-6-6-6"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  piggy: svg('<path d="M3 9.5 12 4l9 5.5z"/><path d="M5.5 10v7.5M10 10v7.5M14 10v7.5M18.5 10v7.5M3 20h18"/>'),
  send: svg('<path d="M21 3 10.5 13.5"/><path d="M21 3l-6.5 18-4-7.5L3 9.5z"/>'),
  card: svg('<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>'),
  plan: svg('<rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4M8 14h3M8 17h6"/>'),
  budget: svg('<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5a9 9 0 0 1 5.5 5.5H15z"/>'),
  debt: svg('<path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/>'),
  hist: svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>'),
  pause: svg('<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>'),
  bolt: svg('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'),
  edit: svg('<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-4-4L4 16z"/>'),
  eye: svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  out: svg('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/>'),
  sync: svg('<path d="M20 11A8 8 0 0 0 5.6 6.6L3.5 8.5M3.5 4v4.5H8M4 13a8 8 0 0 0 14.4 4.4l2.1-1.9M20.5 20v-4.5H16"/>'),
  receipt: svg('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  dollar: svg('<path d="M12 2v20M17 6.5C17 4.6 14.8 4 12 4S7 5 7 7.5 9.5 10.5 12 11s5 1.5 5 4-2.2 3.5-5 3.5-5-.9-5-2.8"/>'),
  sun: svg('<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
};

/* ---------- storage + state ---------- */
const LS = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } },
  del(k) { try { localStorage.removeItem(k); } catch { } },
};
const CONF = window.APP_CONFIG || {};
const goodUrl = u => /^https:\/\/script\.google(usercontent)?\.com\//.test(String(u || '').trim());
let apiUrl = goodUrl(CONF.apiUrl) ? CONF.apiUrl.trim() : (LS.get('bud.url', '') || (LS.get('pay.cfg', null) || {}).url || '');
let auth = LS.get('bud.auth', null);              // {token, user:{id,name,role}}
const EMPTY = () => ({ debts: [], bills: [], entries: [], paychecks: [], settings: {} });
let data = Object.assign(EMPTY(), LS.get('bud.data', {}));
let pending = LS.get('bud.pending', []);
let status = 'ok', loaded = !!LS.get('bud.data', null), lastSync = LS.get('bud.last', 0);
const ui = { view: LS.get('bud.view', 'plan'), off: 0, preview: false, open: {}, who: 'all', dwho: 'all', showTable: false, showAllPromo: false,
  loginAs: LS.get('bud.loginAs', 'ethan') };
const me = () => auth?.user?.id || '';
const isFull = () => auth?.user?.role === 'full';
const oakMode = () => !!auth && (!isFull() || ui.preview);
const save = () => { LS.set('bud.data', data); LS.set('bud.pending', pending); LS.set('bud.last', lastSync); };

/* ---------- server ---------- */
async function post(body, url = apiUrl) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const t = await r.text();
  try { return JSON.parse(t); } catch { const e = new Error('bad_response'); e.code = 'bad_response'; throw e; }
}
function applyOp(st, op) {
  const up = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); };
  switch (op.type) {
    case 'upsertDebt': up(st.debts, op.debt); break;
    case 'deleteDebt': st.debts = st.debts.filter(d => d.id !== op.id); st.entries = st.entries.filter(e => e.debtId !== op.id); break;
    case 'upsertBill': up(st.bills, op.bill); break;
    case 'deleteBill': st.bills = st.bills.filter(b => b.id !== op.id); st.entries = st.entries.filter(e => e.debtId !== op.id); break;
    case 'addEntry': if (!st.entries.some(e => e.id === op.entry.id)) st.entries.push({ by: me(), ...op.entry }); break;
    case 'deleteEntry': st.entries = st.entries.filter(e => e.id !== op.id); break;
    case 'setSetting': st.settings[op.key] = String(op.value); break;
    case 'setPaycheck': {
      let p = st.paychecks.find(x => x.id === op.id);
      if (!p) { p = { id: op.id, income: '', checks: {} }; st.paychecks.push(p); }
      if (op.income !== undefined) p.income = op.income;
      p.checks = { ...(p.checks || {}) };
      for (const [k, v] of Object.entries(op.checks || {})) { if (v === null) delete p.checks[k]; else p.checks[k] = v; }
      break;
    }
  }
}
function commit(ops) {
  ops.forEach(op => applyOp(data, op));
  pending.push(...ops); save(); render(); flush();
}
let inflight = false;
async function flush() {
  if (!auth || !apiUrl || inflight) return;
  inflight = true; status = 'saving'; paintStatus();
  const sent = pending.slice();
  let again = false;
  try {
    const j = await post({ token: auth.token, ops: sent });
    if (!j.ok) { const e = new Error(j.error || 'Server error'); e.code = j.error; throw e; }
    pending = pending.slice(sent.length);
    data = Object.assign(EMPTY(), j.data); pending.forEach(op => applyOp(data, op));
    if (j.user) { auth.user = j.user; LS.set('bud.auth', auth); }
    loaded = true; lastSync = Date.now(); status = 'ok'; save();
    if (j.errors && j.errors.length) toast(`Not saved: ${j.errors[0]}`);
    again = pending.length > 0;
  } catch (e) {
    if (e.code === 'auth') { inflight = false; return signOutLocal('Your sign-in expired. Please sign in again.'); }
    status = 'offline';
  } finally {
    inflight = false;
    if (auth && !$('.scrim')) render(); else paintStatus();
    if (again) flush();
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') flush(); });
setInterval(() => { if (document.visibilityState === 'visible' && !$('.scrim')) flush(); }, 60000);

/* ---------- finance engine ---------- */
const WHO_LABEL = { ethan: 'Ethan', oakley: 'Oakley', savings: 'Savings' };   // people (for "logged by")

function oakCard(b, P, m) {

/* ---------- ticking things off ---------- */
function findRow(key) { const P = planFor(buildModel(), 0); return P && P.rows.find(r => r.ln.key === key) && { P, r: P.rows.find(r => r.ln.key === key) }; }
function tick(key) {
  const f = findRow(key); if (!f) return;
  const { P, r } = f, ln = r.ln, now = new Date().toISOString();
  if (r.cushion) return;
  if (r.chk) {
    const ops = [{ type: 'setPaycheck', id: P.start, checks: { [ln.key]: null } }];
    const e = r.chk.entryId && data.entries.find(x => x.id === r.chk.entryId);
    if (e && (isFull() || e.by === me())) ops.push({ type: 'deleteEntry', id: e.id });
    return commit(ops);
  }
  if (r.covered) return toast('Already logged as paid. Undo it from History.');
  const ops = [], chk = { amt: r.remaining, at: now, by: me() };
  // log a real payment only when money leaves for the bill itself (not when it's just set aside or sent to Ethan)
  const logIt = ln.mode === 'due' || (ln.kind === 'debt' && (bkById(ln.who).kind === 'pay' || ln.mode === 'even'));
  if (logIt) {
    const e = { id: uid('e'), debtId: ln.id, date: todayStr(), kind: 'payment', amount: r2(r.remaining), note: 'Paycheck ' + fmt(P.start), createdAt: now, by: me() };
    ops.push({ type: 'addEntry', entry: e }); chk.entryId = e.id;
  }
  ops.push({ type: 'setPaycheck', id: P.start, checks: { [ln.key]: chk } });
  commit(ops);
  if (logIt && ln.kind === 'debt') toast(`${moneyC(r.remaining)} logged to ${ln.name}`);
}
function bucketToggle(id) {
  const m = buildModel(), P = planFor(m, 0); if (!P) return;
  const b = P.buckets.find(x => x.id === id), key = 'bk:' + id;
  if (b.chk) {   // undo
    const ops = [{ type: 'setPaycheck', id: P.start, checks: { [key]: null } }];
    for (const eid of b.chk.entryIds || []) { const e = data.entries.find(x => x.id === eid); if (e && (isFull() || e.by === me())) ops.push({ type: 'deleteEntry', id: eid }); }
    return commit(ops);
  }
  const ops = [], chk = { amt: b.total, at: new Date().toISOString(), by: me(), entryIds: [] };
  if (b.logs) for (const r of b.rows) {   // sending to the lender = paying the debt
    if (r.ln.kind !== 'debt' || r.covered || r.remaining <= 0) continue;
    const e = { id: uid('e'), debtId: r.ln.id, date: todayStr(), kind: 'payment', amount: r2(r.remaining), note: b.name, createdAt: chk.at, by: me() };
    ops.push({ type: 'addEntry', entry: e }); chk.entryIds.push(e.id);
  }
  ops.push({ type: 'setPaycheck', id: P.start, checks: { [key]: chk } });
  commit(ops);
}

  <div class="who-pick">${['ethan', 'oakley'].map(v => `<button type="button" data-a="pick" data-v="${v}" aria-pressed="${who === v}"><span class="av">${v[0].toUpperCase()}</span>${v === 'ethan' ? 'Ethan' : 'Oakley'}</button>`).join('')}</div>
  <form data-form="login">
  ${needUrl ? `<label class="field"><span>App link (one time)</span><input class="in" name="url" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><small>The Web app URL from Apps Script. Ethan can put it in config.js so nobody has to paste it.</small></label>` : ''}
  <label class="field"><span>Password</span><input class="in" name="pw" type="password" required autocomplete="current-password" autocapitalize="off"></label>
  <p class="err" id="err" ${msg ? '' : 'hidden'}>${esc(msg || '')}</p>
  <button class="btn pri block" style="margin-top:6px">Sign in</button></form>
  <p class="note" style="margin-top:18px">You'll stay signed in on this phone.</p></div>`;
}
async function doLogin(f) {
  const err = $('#err', f), fail = t => { err.textContent = t; err.hidden = false; btn.disabled = false; btn.textContent = 'Sign in'; };
  const btn = $('button.pri', f);
  const url = apiUrl || (f.url ? f.url.value.trim() : '');
  if (!goodUrl(url)) return fail('That link should start with https://script.google.com/');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const j = await post({ action: 'login', user: ui.loginAs, password: f.pw.value, device: navigator.userAgent.slice(0, 80) }, url);
    if (!j.ok) {
      return fail({ bad_login: 'That password didn\'t match. Try again.', locked: 'Too many tries. Wait 15 minutes and try again.',
        change_password: 'Passwords haven\'t been set yet. Ethan needs to change them in Code.gs and redeploy.' }[j.error] || j.error);
    }
    apiUrl = url; LS.set('bud.url', url);
    auth = { token: j.token, user: j.user }; LS.set('bud.auth', auth);
    data = Object.assign(EMPTY(), j.data); pending = []; loaded = true; lastSync = Date.now(); status = 'ok'; save();
    ui.preview = false; ui.off = 0;
    const link = location.origin + location.pathname;
    if (isFull() && data.settings.appUrl !== link && location.protocol === 'https:') commit([{ type: 'setSetting', key: 'appUrl', value: link }]);
    else render();
    scrollTo(0, 0);
  } catch (x) {
    fail(x.code === 'bad_response' ? 'The app link answered with a web page instead of data. In Apps Script, the deployment must be "Execute as: Me" and "Who has access: Anyone".' : 'Couldn\'t reach the app link. Check your internet and the link.');
  }
}
function signOutLocal(msg) {
  auth = null; data = EMPTY(); pending = []; loaded = false; lastSync = 0; ui.preview = false; ui.off = 0;
  ['bud.auth', 'bud.data', 'bud.pending', 'bud.last'].forEach(LS.del);
  layer.innerHTML = ''; document.body.style.overflow = '';
  applyTheme(); renderLogin(msg);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'scrim') { if (e.target === el) closeSheet(); return; }
  switch (a) {
    case 'nav': layer.innerHTML = ''; document.body.style.overflow = ''; ui.view = el.dataset.v; LS.set('bud.view', ui.view); render(); scrollTo(0, 0); break;
    case 'pick': ui.loginAs = el.dataset.v; LS.set('bud.loginAs', ui.loginAs); { const pw = $('[name=pw]')?.value, u = $('[name=url]')?.value; applyTheme(); renderLogin(); if (pw) $('[name=pw]').value = pw; if (u && $('[name=url]')) $('[name=url]').value = u; $('[name=pw]').focus(); } break;
    case 'off': ui.off = Math.max(0, ui.off + +el.dataset.d); ui.open = {}; render(); break;
    case 'oexp': {
      const b = el.dataset.b; ui.open[b] = !ui.open[b];
      el.setAttribute('aria-expanded', ui.open[b]); $('#drop-' + b)?.classList.toggle('open', ui.open[b]);
      const sm = $('small', el); if (ui.open[b] && sm) sm.remove(); else if (!ui.open[b] && !sm) el.insertAdjacentHTML('beforeend', '<small>see details</small>');
      break;
    }
    case 'tick': tick(el.dataset.k); break;
    case 'bk': bucketToggle(el.dataset.b); break;
    case 'who': ui.who = el.dataset.v; render(); break;
    case 'dwho': ui.dwho = el.dataset.v; render(); break;
    case 'quick': quickSheet(); break;
    case 'log': logSheet(id, el.dataset.amt && +el.dataset.amt > 0 ? el.dataset.amt : '', 'payment'); break;
    case 'debt': if (oakMode()) break; debtSheet(id); break;
    case 'bill': if (oakMode()) break; billSheet(id); break;
    case 'amt': amountSheet(id); break;
    case 'new': editSheet(null); break;
    case 'edit': editSheet(id); break;
    case 'newbill': billEditSheet(null); break;
    case 'editbill': billEditSheet(id); break;
    case 'pause': pauseSheet(el.dataset.k, id); break;
    case 'resume': {
      const k = el.dataset.k, x = (k === 'debt' ? data.debts : data.bills).find(v => v.id === id);
      layer.innerHTML = ''; document.body.style.overflow = '';
      commit([{ type: k === 'debt' ? 'upsertDebt' : 'upsertBill', [k === 'debt' ? 'debt' : 'bill']: { ...x, snoozeUntil: '' } }]); toast(`${x.name} is back on`); break;
    }
    case 'income': incomeSheet(el.dataset.p); break;
    case 'newbk': bucketSheet(null); break;
    case 'editbk': bucketSheet(id); break;
    case 'rmbk': {
      const b = buckets().find(x => x.id === id); if (!b || b.builtin) break;
      const items = [...data.debts.filter(d => whoOf(d) === id), ...data.bills.filter(x => whoOf(x) === id)];
      confirmSheet(`Delete ${b.name}?`, items.length ? `${items.length} thing${items.length > 1 ? 's' : ''} in it (${items.slice(0, 3).map(x => esc(x.name)).join(', ')}${items.length > 3 ? '…' : ''}) will move to <b>${esc(bkById('oakley').name)}</b>.` : 'Nothing is in it right now.', [{ label: 'Delete', cls: 'danger', fn: () => {
        const ops = [...data.debts.filter(d => whoOf(d) === id).map(d => ({ type: 'upsertDebt', debt: { ...d, who: 'oakley' } })), ...data.bills.filter(x => whoOf(x) === id).map(x => ({ type: 'upsertBill', bill: { ...x, who: 'oakley' } }))];
        ops.push({ type: 'setSetting', key: 'buckets', value: savedBuckets(buckets().filter(x => x.id !== id)) });
        commit(ops); toast(`${b.name} deleted`);
      } }]);
      break;
    }
    case 'settings': settingsSheet(); break;
    case 'osettings': oakSettingsSheet(); break;
    case 'close': closeSheet(); break;
    case 'sync': layer.innerHTML = ''; document.body.style.overflow = ''; flush(); break;
    case 'promoall': ui.showAllPromo = !ui.showAllPromo; render(); break;
    case 'preview': layer.innerHTML = ''; document.body.style.overflow = ''; ui.preview = true; ui.off = 0; ui.open = {}; render(); scrollTo(0, 0); break;
    case 'unpreview': layer.innerHTML = ''; document.body.style.overflow = ''; ui.preview = false; ui.off = 0; render(); scrollTo(0, 0); break;
    case 'remove': {
      const d = data.debts.find(x => x.id === id);
      confirmSheet(`Remove ${d.name}?`, 'Archive hides it but keeps its history. Delete erases it and its payments for good. Want to ignore it for a while instead? Use <b>Pause</b>.', [
        { label: 'Archive (recommended)', cls: 'pri', fn: () => { commit([{ type: 'upsertDebt', debt: { ...d, archived: true } }]); toast(`${d.name} archived`, 'Undo', () => commit([{ type: 'upsertDebt', debt: { ...d, archived: false } }])); } },
        { label: 'Delete forever', cls: 'danger', fn: () => commit([{ type: 'deleteDebt', id }]) }]);
      break;
    }
    case 'rmbill': {
      const b = data.bills.find(x => x.id === id);
      confirmSheet(`Remove ${b.name}?`, 'It stops counting toward paychecks right away.', [
        { label: 'Remove', cls: 'danger', fn: () => { commit([{ type: 'upsertBill', bill: { ...b, archived: true } }]); toast(`${b.name} removed`, 'Undo', () => commit([{ type: 'upsertBill', bill: { ...b, archived: false } }])); } }]);
      break;
    }
    case 'restore': { const d = data.debts.find(x => x.id === id); commit([{ type: 'upsertDebt', debt: { ...d, archived: false } }]); break; }
    case 'purge': { const d = data.debts.find(x => x.id === id); confirmSheet(`Delete ${d.name} forever?`, 'This erases the debt and all of its payments. It can\'t be undone.', [{ label: 'Delete forever', cls: 'danger', fn: () => commit([{ type: 'deleteDebt', id }]) }]); break; }
    case 'delentry': { const en = data.entries.find(x => x.id === id); commit([{ type: 'deleteEntry', id }]); toast('Entry deleted', 'Undo', () => commit([{ type: 'addEntry', entry: en }])); break; }
    case 'csv': {
      const rows = [['date', 'item', 'type', 'amount', 'note', 'by'], ...data.entries.slice().sort((x, y) => x.date.localeCompare(y.date)).map(x => [x.date, nameOf(x.debtId), x.kind, x.amount, x.note, x.by])];
      const csv = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), l = document.createElement('a'); l.href = url; l.download = 'payoff-history.csv'; l.click(); setTimeout(() => URL.revokeObjectURL(url), 500);
      break;
    }
    case 'logout': confirmSheet('Sign out of this phone?', 'Your data stays safe. You\'ll need your password to get back in.', [{ label: 'Sign out', cls: 'danger', fn: () => { const t = auth?.token; post({ action: 'logout', token: t }).catch(() => { }); signOutLocal(); } }]); break;
    case 'logoutOthers': confirmSheet('Sign out every other phone?', 'Anyone else (including Oakley) will need to sign in again with their password. This phone stays signed in.', [{ label: 'Sign out other phones', cls: 'danger', fn: async () => { try { const j = await post({ action: 'logoutOthers', token: auth.token }); toast(j.ok ? 'Other phones signed out' : 'Couldn\'t do that right now'); } catch { toast('You\'re offline. Try again later.'); } } }]); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.bl[role=button]')) { e.preventDefault(); e.target.click(); } });

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const kind = f.dataset.form, err = $('#err', f), fail = t => { err.textContent = t; err.hidden = false; };
  const now = new Date().toISOString();
  if (kind === 'login') return doLogin(f);
  if (kind === 'payday') return commit([{ type: 'setSetting', key: 'payAnchor', value: f.d.value }]);
  if (kind === 'settings') {
    const ops = [];
    if (f.anchor.value) ops.push({ type: 'setSetting', key: 'payAnchor', value: f.anchor.value });
    ops.push({ type: 'setSetting', key: 'payEvery', value: f.every.value });
    const inc = f.income.value === '' ? 0 : parseMoney(f.income.value);
    if (!(inc >= 0)) return toast('Paycheck should be a number, like 2150.');
    ops.push({ type: 'setSetting', key: 'income', value: r2(inc) });
    const cu = f.cushion.value === '' ? 0 : parseMoney(f.cushion.value);
    if (!(cu >= 0)) return toast('Cushion should be a number, like 20.');
    ops.push({ type: 'setSetting', key: 'cushion', value: r2(cu) });
    const em = f.email.value.trim(); if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('That email doesn\'t look right.');
    ops.push({ type: 'setSetting', key: 'notifyEmail', value: em });
    layer.innerHTML = ''; document.body.style.overflow = ''; commit(ops); toast('Settings saved'); return;
  }
  if (kind === 'bucket') {
    const id = f.dataset.id, name = f.name.value.trim();
    if (!name) return fail('Give it a name.');
    let list = buckets().map(x => ({ ...x }));
    if (id) { const x = list.find(y => y.id === id); x.name = name; x.color = f.color.value; if (!x.builtin) { x.kind = f.kind.value; x.logs = f.kind.value === 'send' && f.logs.checked; } }
    else list.push({ id: 'k' + Date.now().toString(36), name, kind: f.kind.value, color: f.color.value, logs: f.kind.value === 'send' && f.logs.checked });
    commit([{ type: 'setSetting', key: 'buckets', value: savedBuckets(list) }]);
    toast(id ? 'Saved' : `${name} added. Now pick it on a debt or bill.`);
    return settingsSheet();
  }
  if (kind === 'income') {
    const v = parseMoney(f.amount.value); if (!(v >= 0)) return fail('Enter the amount, like 2150.');
    const ops = [{ type: 'setPaycheck', id: f.dataset.p, income: r2(v) }];
    if (f.usual.checked && isFull()) ops.push({ type: 'setSetting', key: 'income', value: r2(v) });
    layer.innerHTML = ''; document.body.style.overflow = ''; commit(ops); return;
  }
  if (kind === 'log') {
    const amount = parseMoney(f.amount.value), k = f.kind.value;
    if (!(amount >= 0) || (k !== 'sync' && amount <= 0)) return fail('Enter an amount greater than $0.');
    if (!f.date.value) return fail('Pick a date.');
    layer.innerHTML = ''; document.body.style.overflow = '';
    const entry = { id: uid('e'), debtId: f.debt.value, date: f.date.value, kind: k, amount: r2(amount), note: f.note.value.trim(), createdAt: now, by: me() };
    commit([{ type: 'addEntry', entry }]);
    const name = nameOf(entry.debtId);
    toast(k === 'payment' ? `${money(entry.amount)} logged to ${name}` : k === 'charge' ? `Charge added to ${name}` : `${name} balance set`, 'Undo', () => commit([{ type: 'deleteEntry', id: entry.id }]));
    return;
  }
  if (kind === 'debt') {
    const id = f.dataset.id, old = id ? data.debts.find(d => d.id === id) : null, bal = parseMoney(f.balance.value);
    if (!f.name.value.trim()) return fail('Give the debt a name.');
    if (!(bal >= 0)) return fail('Enter the balance as a number, like 1250.40.');
    const apr = f.apr.value === '' ? 0 : parseMoney(f.apr.value), min = f.min.value === '' ? 0 : parseMoney(f.min.value), plan = f.plan.value === '' ? '' : parseMoney(f.plan.value);
    if (!(apr >= 0 && apr <= 100)) return fail('Interest rate should be between 0 and 100.');
    if (!(min >= 0) || (plan !== '' && !(plan >= 0))) return fail('Payments need to be numbers.');
    const zero = f.zero.checked;
    const debt = { ...(old || { id: uid('d'), startBalance: r2(bal), startDate: todayStr(), archived: false, sort: Date.now() % 1e9, createdAt: now, snoozeUntil: '' }),
      name: f.name.value.trim(), description: f.description.value.trim(), apr, minPayment: min, dueDay: f.due.value === '' ? '' : +f.due.value, zeroApr: zero, zeroUntil: zero ? f.until.value : '', plan, who: f.who.value, spread: f.spread.checked };
    const ops = [{ type: 'upsertDebt', debt }, ...splitOps(old, debt)];
    if (old) { const cur = buildModel().all.find(i => i.debt.id === id).sim.balNow; if (Math.abs(cur - bal) > 0.004) ops.push({ type: 'addEntry', entry: { id: uid('e'), debtId: id, date: todayStr(), kind: 'sync', amount: r2(bal), note: 'Balance edited', createdAt: now, by: me() } }); }
    layer.innerHTML = ''; document.body.style.overflow = ''; commit(ops);
    if (!old) toast(`${debt.name} added`);
    return;
  }
  if (kind === 'bill') {
    const id = f.dataset.id, old = id ? data.bills.find(b => b.id === id) : null;
    if (!f.name.value.trim()) return fail('Give it a name.');
    const amount = f.amount.value === '' ? 0 : parseMoney(f.amount.value);
    if (!(amount >= 0)) return fail('Amount should be a number, like 89.99.');
    const freq = f.freq.value;
    if (freq === 'yearly' && !f.month.value) { /* fine: just saves up evenly */ }
    const bill = { ...(old || { id: uid('b'), archived: false, sort: Date.now() % 1e9, createdAt: now, snoozeUntil: '' }),
      name: f.name.value.trim(), group: f.group.value.trim() || 'Other', who: f.who.value, amount: r2(amount), freq,
      dueDay: freq === 'paycheck' || f.due.value === '' ? '' : +f.due.value, dueMonth: freq === 'yearly' && f.month.value ? +f.month.value : '',
      spread: freq === 'monthly' ? f.spread.checked : true, varies: freq === 'monthly' ? f.varies.checked : false, note: f.note.value.trim(),
      updatedAt: !old || num(old.amount) !== r2(amount) ? todayStr() : (old.updatedAt || '') };
    const ops = [{ type: 'upsertBill', bill }, ...splitOps(old, bill)];
    if (old && num(old.amount) !== r2(amount)) ops.push({ type: 'addEntry', entry: { id: uid('e'), debtId: bill.id, date: todayStr(), kind: 'billamt', amount: r2(amount), note: '', createdAt: now, by: me() } });
    layer.innerHTML = ''; document.body.style.overflow = ''; commit(ops);
    if (!old) toast(`${bill.name} added`);
    return;
  }
  if (kind === 'amt') {
    const id = f.dataset.id, b = data.bills.find(x => x.id === id), v = parseMoney(f.amount.value);
    if (!(v >= 0)) return fail('Enter the amount, like 148.32.');
    layer.innerHTML = ''; document.body.style.overflow = '';
    commit([{ type: 'upsertBill', bill: { ...b, amount: r2(v), updatedAt: todayStr() } },
      { type: 'addEntry', entry: { id: uid('e'), debtId: id, date: todayStr(), kind: 'billamt', amount: r2(v), note: '', createdAt: now, by: me() } }]);
    toast(`${b.name} set to ${moneyC(r2(v))}`);
    return;
  }
  if (kind === 'pause') {
    const k = f.dataset.k, id = f.dataset.id, x = (k === 'debt' ? data.debts : data.bills).find(v => v.id === id);
    const when = new Date(`${f.d.value}T${f.t.value || '09:00'}`);
    if (isNaN(when)) return fail('Pick a date and time.');
    if (when.getTime() < Date.now() + 30 * 60000) return fail('Pick a time in the future.');
    layer.innerHTML = ''; document.body.style.overflow = '';
    commit([{ type: k === 'debt' ? 'upsertDebt' : 'upsertBill', [k === 'debt' ? 'debt' : 'bill']: { ...x, snoozeUntil: when.toISOString() } }]);
    toast(`${x.name} paused until ${fmtDT(when.toISOString())}`);
    return;
  }
});

function splitOps(old, x) {
  const was = !!(old && old.spread), now = !!x.spread, k = 'splitSince_' + x.id;
  if (now && !was) return [{ type: 'setSetting', key: k, value: todayStr() }];
  if (!now && was && data.settings[k]) return [{ type: 'setSetting', key: k, value: '' }];
  return [];
}

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
render();
if (auth) flush();
</script>
