<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payoff</title>
<meta name="description" content="A private debt payoff tracker for two.">
<meta name="theme-color" content="#0C1E20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payoff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF0EE; --surface:#FFFFFF; --ink:#0F2A2C; --ink2:#43605F; --muted:#74898A; --line:#D7E1DE; --line2:#E6EDEB;
  --accent:#0B6E6A; --accent-ink:#FFFFFF; --accent-soft:#D5EBE7;
  --amber:#A8660F; --amber-soft:#F6E7C9; --red:#B03A2E; --red-soft:#F7DDD8;
  --s1:#0B5F5B; --s2:#157872; --s3:#2A918A; --s4:#4CA8A0; --s5:#78BFB8; --s6:#A4D5CF;
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --nav-h:72px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1718; --surface:#102326; --ink:#E7F1EF; --ink2:#A7BFBC; --muted:#718B89; --line:#1E3A3D; --line2:#183033;
    --accent:#52C7BA; --accent-ink:#06201F; --accent-soft:#12403F;
    --amber:#E5B455; --amber-soft:#3A2F15; --red:#F18C80; --red-soft:#45201C;
    --s1:#2FA89D; --s2:#3FB5AA; --s3:#5BC2B8; --s4:#7DCFC6; --s5:#A0DCD5; --s6:#C4E9E4;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center}
.brand i:after{content:"";width:9px;height:9px;border:2px solid var(--accent-ink);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.top-r{display:flex;align-items:center;gap:6px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:transparent}
.status b{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.status.saving b{background:var(--amber);animation:pulse 1s infinite}
.status.offline b,.status.auth b{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{padding:22px 0 10px}
.hero-k{margin:0 0 2px;color:var(--ink2);font-size:15px}
.hero-n{font:700 clamp(46px,13vw,68px)/1 var(--display);letter-spacing:-.03em;margin:0}
.hero-n small{font-size:.42em;color:var(--muted);letter-spacing:0;font-weight:500}
.stack{display:flex;gap:2px;height:20px;margin:18px 0 10px}
.stack button{border:0;padding:0;border-radius:6px;min-width:3px;position:relative;transition:transform .15s}
.stack button:hover{transform:scaleY(1.25)}
.stack-legend{margin:0;font-size:13.5px;color:var(--ink2)}
.hero-sub{margin:16px 0 0;font-size:17px;line-height:1.4;max-width:34em}
.hero-sub b{font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.pill b{color:var(--ink);font-weight:600}

/* sections */
.sec{padding:26px 0 4px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;gap:12px}
.sec-h h2{font:700 21px/1.15 var(--display);letter-spacing:-.015em;margin:0}
.sec-h span{color:var(--ink2);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.meter{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin:12px 0 4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.meter-t{display:flex;justify-content:space-between;color:var(--ink2);font-size:14px}
.meter-t b{color:var(--ink);font-weight:600}

/* rows */
.rows{margin:12px -16px -16px;border-top:1px solid var(--line2)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.row .s{font-size:13.5px;color:var(--ink2);margin-top:1px}
.row .amt{font:600 17px/1 var(--body);text-align:right}
.row .amt small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.btn{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 15px;font-weight:600;font-size:14.5px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:active{transform:translateY(1px)}
.empty{padding:22px 4px;color:var(--ink2)}

/* flat lists (debts, promo) */
.list{border-top:1px solid var(--line)}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 2px}
.item:hover{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.item .l1{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.item .nm{font-weight:700;font-size:17px;display:flex;align-items:center}
.item .ds{color:var(--ink2);font-size:14px;margin-left:6px;font-weight:400}
.item .bal{font:700 20px/1 var(--display);letter-spacing:-.01em}
.item .l2{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:9px;align-items:center;font-size:13.5px;color:var(--ink2)}
.bar{height:5px;border-radius:9px;background:var(--line2);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.note{font-size:14px;color:var(--ink2);margin:10px 0 0}
.note.warn{color:var(--amber)} .note.ok{color:var(--accent)}

/* chart */
.chartbox{position:relative;margin-top:4px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:13px;line-height:1.3;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
.tip b{display:block;font-size:15px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line2);text-align:left}
table.t td:last-child,table.t th:last-child{text-align:right}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.7fr 1fr;gap:4px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:99px;padding:6px}
.nav button{white-space:nowrap;border:0;background:none;border-radius:99px;padding:11px 6px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .log{background:var(--accent);color:var(--accent-ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,16,17,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet h3{font:700 22px/1.15 var(--display);margin:0 0 4px;letter-spacing:-.015em;display:flex;align-items:center}
.sheet .sub{color:var(--ink2);margin:0 0 16px;font-size:14.5px}
.field{display:block;margin:0 0 13px}
.field>span{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.in{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;border-radius:12px;background:var(--bg);margin-bottom:13px}
.switch span{font-weight:600;font-size:15px}
.switch small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px;padding:12px 15px}
.err{color:var(--red);font-size:14px;margin:0 0 10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;margin:14px 0}
.facts div{background:var(--surface);padding:11px 13px}
.facts dt{font-size:12.5px;color:var(--muted)} .facts dd{margin:2px 0 0;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;z-index:60;display:flex;gap:14px;align-items:center;font-size:14.5px;max-width:92vw}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:var(--accent-ink)}}

/* connect screen */
.connect{max-width:460px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px 40px}
.connect h1{font:700 34px/1.05 var(--display);letter-spacing:-.025em;margin:22px 0 10px}
.connect p{color:var(--ink2)}
.skeleton{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--line2),var(--surface),var(--line2));background-size:200% 100%;animation:sk 1.4s infinite;margin:14px 0}
@keyframes sk{to{background-position:-200% 0}}

@media (min-width:920px){
  .wrap{max-width:1040px}
  .cols{display:grid;grid-template-columns:1.1fr .9fr;gap:0 40px;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* =====================================================================
   Payoff — debt tracker front-end. Data lives in the user's own Google
   Sheet via the Apps Script web app (see Code.gs). Nothing else is stored
   outside this device except what is saved to that Sheet.
   ===================================================================== */

/* ---------- tiny helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const ymd = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const addDays = (s, n) => { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const todayStr = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const money = (n, cents = true) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', cents ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumFractionDigits: 0 });
const moneyC = n => { // cents only if needed
  return Math.abs(n - Math.round(n)) < 0.005 ? money(n, false) : money(n, true);
};
const fmt = (s, o = { month: 'short', day: 'numeric' }) => pd(s).toLocaleDateString('en-US', { timeZone: 'UTC', ...o });
const fmtY = s => fmt(s, { month: 'short', day: 'numeric', year: 'numeric' });
const fmtMY = s => fmt(s, { month: 'short', year: 'numeric' });
const fmtWD = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric' });
const ordinal = n => { const v = n % 100; return n + (['th', 'st', 'nd', 'rd'][(v - 20) % 10] || ['th', 'st', 'nd', 'rd'][v] || 'th'); };
const rel = (s, t) => { const d = diffDays(t, s); return d === 0 ? 'today' : d === 1 ? 'tomorrow' : d === -1 ? 'yesterday' : d > 0 ? `in ${d} days` : `${-d} days ago`; };
const debtColor = id => {
  if (!id) return 'var(--muted)';
  const colors = ['var(--s1)', 'var(--amber)', 'var(--s3)', 'var(--red)', 'var(--s5)', 'var(--accent)'];
  const num = String(id).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
  return colors[num % colors.length];
};

/* ---------- state ---------- */
const LS = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } },
  del(k) { try { localStorage.removeItem(k); } catch { } },
};
let cfg = LS.get('pay.cfg', null);          // {url, pass}
let data = LS.get('pay.data', { debts: [], entries: [], settings: {} });
let pending = LS.get('pay.pending', []);
let status = 'ok';                          // ok | saving | offline | auth
let loaded = !!LS.get('pay.data', null);
let view = 'overview';
let showTable = false, showAllPromo = false;
let lastSync = LS.get('pay.last', 0);

(function readInvite() {
  const m = location.hash.match(/[#&]c=([^&]+)/);
  if (!m) return;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (o.u && o.p) { cfg = { url: o.u, pass: o.p }; LS.set('pay.cfg', cfg); } } catch { }
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ---------- ops: applied locally, queued, then sent to the Sheet ---------- */
function applyOp(st, op) {
  switch (op.type) {
    case 'upsertDebt': { const i = st.debts.findIndex(d => d.id === op.debt.id); if (i >= 0) st.debts[i] = op.debt; else st.debts.push(op.debt); break; }
    case 'deleteDebt': st.debts = st.debts.filter(d => d.id !== op.id); st.entries = st.entries.filter(e => e.debtId !== op.id); break;
    case 'addEntry': if (!st.entries.some(e => e.id === op.entry.id)) st.entries.push(op.entry); break;
    case 'deleteEntry': st.entries = st.entries.filter(e => e.id !== op.id); break;
    case 'setSetting': st.settings[op.key] = String(op.value); break;
  }
}
function commit(ops) {
  ops.forEach(op => applyOp(data, op));
  pending.push(...ops);
  LS.set('pay.data', data); LS.set('pay.pending', pending);
  render(); flush();
}
let inflight = false;
async function flush() {
  if (!cfg || inflight) return;
  inflight = true; status = 'saving'; paintStatus();
  const sent = pending.slice();
  try {
    const res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pass: cfg.pass, ops: sent }) });
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error || 'Server error'); e.code = j.error; throw e; }
    pending = pending.slice(sent.length);
    data = j.data; pending.forEach(op => applyOp(data, op));
    loaded = true; lastSync = Date.now(); status = 'ok';
    LS.set('pay.data', data); LS.set('pay.pending', pending); LS.set('pay.last', lastSync);
  } catch (e) {
    status = e.code === 'bad_passcode' ? 'auth' : 'offline';
  } finally {
    inflight = false; render();
    if (status === 'ok' && pending.length) flush();
  }
}
const refresh = () => flush();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('.scrim')) refresh(); }, 90000);

/* ---------- finance engine ---------- */
function dueInRange(day, from, to) {
  let [y, m] = from.split('-').map(Number);
  for (let i = 0; i < 3; i++) {
    const d = `${y}-${pad(m)}-${pad(Math.min(day, dim(y, m)))}`;
    if (d >= to) return null;
    if (d >= from) return d;
    if (++m > 12) { m = 1; y++; }
  }
  return null;
}
function prevDue(day, d) {
  let [y, m] = d.split('-').map(Number);
  if (--m < 1) { m = 12; y--; }
  return `${y}-${pad(m)}-${pad(Math.min(day, dim(y, m)))}`;
}
function makePlan(debt, bal, today) {
  const min = num(debt.minPayment); let req = 0, monthsLeft = null;
  if (debt.zeroApr && debt.zeroUntil && debt.zeroUntil > today) {
    monthsLeft = Math.max(1, Math.floor(diffDays(today, debt.zeroUntil) / 30.44));
    req = Math.ceil(bal / monthsLeft);
  }
  const auto = Math.max(min, req), custom = num(debt.plan);
  return { min, req, monthsLeft, auto, planned: custom > 0 ? custom : auto, custom: custom > 0 };
}
/* Day-by-day balance: interest accrues daily at APR/365 (0% while interest-free) and
   is added to the balance on the 1st of each month. Past days use logged entries;
   future days assume the planned payment on the due day each month. */
function simulate(debt, entries, today) {
  const start = debt.startDate && debt.startDate <= today ? debt.startDate : today;
  const apr = num(debt.apr) / 100 / 365;
  const zeroEnd = debt.zeroApr && debt.zeroUntil ? debt.zeroUntil : null;
  const rateOn = d => (debt.zeroApr && (!zeroEnd || d <= zeroEnd)) ? 0 : apr;
  let bal = num(debt.startBalance), pend = 0, interest = 0, paid = 0;
  const month = {}, byDate = {};
  entries.filter(e => e.debtId === debt.id && e.date >= start && e.date <= today)
    .sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''))
    .forEach(e => (byDate[e.date] ||= []).push(e));
  const pay = amt => { const x = Math.min(pend, amt); pend -= x; bal = Math.max(0, bal - (amt - x)); };
  // Interest for a day is added before that day's payments, so a balance you enter or set today is shown as-is.
  const accrue = d => {
    const r = rateOn(d);
    if (r > 0 && bal > 0) { const i = bal * r; pend += i; interest += i; }
    if (d.endsWith('-01')) { bal += pend; pend = 0; month[d] = bal; }
  };
  let d = start;
  for (; ;) {
    if (d > start) accrue(d);
    for (const e of byDate[d] || []) {
      const a = num(e.amount);
      if (e.kind === 'charge') bal += a; else if (e.kind === 'sync') { bal = a; pend = 0; } else { pay(a); paid += a; }
    }
    if (d === today) break;
    d = addDays(d, 1);
  }
  const balNow = bal + pend, interestToDate = interest;
  const plan = makePlan(debt, balNow, today);
  let payoff = null, balAtPromoEnd = null;
  const payDom = debt.dueDay ? num(debt.dueDay) : 1;
  for (let i = 1; i <= 3650 && bal + pend > 0.005; i++) {
    d = addDays(d, 1);
    const [y, m, dd] = d.split('-').map(Number);
    accrue(d);
    if (dd === Math.min(payDom, dim(y, m))) pay(Math.min(plan.planned, bal + pend));
    if (zeroEnd && d === zeroEnd) balAtPromoEnd = bal + pend;
    if (bal + pend <= 0.005) payoff = d;
  }
  if (balNow > 0.005 && zeroEnd && zeroEnd > today && balAtPromoEnd === null && payoff) balAtPromoEnd = 0;
  const never = balNow > 0.005 && !payoff;
  return { start, balNow, interestToDate, paid, plan, payoff, never, balAtPromoEnd, month,
    isZeroNow: rateOn(today) === 0, monthlyInterest: rateOn(today) === 0 ? 0 : balNow * num(debt.apr) / 100 / 12, done: balNow <= 0.005 };
}

function buildModel() {
  const today = todayStr();
  const debts = data.debts.filter(d => !d.archived).sort((a, b) => a.sort - b.sort);
  const items = debts.map(debt => ({ debt, sim: simulate(debt, data.entries, today) }));
  const live = items.filter(i => !i.sim.done);
  const total = items.reduce((s, i) => s + i.sim.balNow, 0);
  const paid = items.reduce((s, i) => s + i.sim.paid, 0);
  const anyNever = live.some(i => i.sim.never);
  const debtFree = live.length === 0 ? 'done' : anyNever ? null : live.reduce((m, i) => i.sim.payoff > m ? i.sim.payoff : m, '');
  const monthlyInterest = items.reduce((s, i) => s + i.sim.monthlyInterest, 0);
  const m = { today, items, live, total, paid, anyNever, debtFree, monthlyInterest };
  m.cycle = cycleInfo(today);
  m.chart = chartPoints(m);
  return m;
}
function cycleInfo(today) {
  const anchor = data.settings.payAnchor, every = Math.max(1, num(data.settings.payEvery) || 14);
  if (!anchor) return null;
  const k = Math.floor(diffDays(anchor, today) / every), start = addDays(anchor, k * every);
  return { start, next: addDays(start, every), every };
}
const paidSince = (debt, after) => data.entries.filter(e => e.debtId === debt.id && e.kind === 'payment' && e.date > after).reduce((s, e) => s + num(e.amount), 0);

function paycheckRows(m) {
  const c = m.cycle; if (!c) return null;
  const rows = [];
  for (const it of m.items) {
    const { debt, sim } = it;
    let due = null, since, target;
    if (debt.dueDay) {
      due = dueInRange(num(debt.dueDay), c.start, c.next);
      if (!due) continue;
      since = paidSince(debt, prevDue(num(debt.dueDay), due));
    } else {
      since = paidSince(debt, addDays(c.start, -1));
    }
    const p = makePlan(debt, sim.balNow + since, m.today);   // plan as it stood before this period's payments
    target = debt.dueDay ? Math.min(p.planned, sim.balNow + since) : Math.min(Math.ceil(p.planned * c.every / 30.44), sim.balNow + since);
    if (sim.done && since === 0) continue;
    const got = Math.min(since, target), remaining = Math.max(0, target - got);
    rows.push({ it, due, since, target, got, remaining, minMet: p.min > 0 && since >= p.min });
  }
  rows.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || a.it.debt.name.localeCompare(b.it.debt.name));
  const need = rows.reduce((s, r) => s + r.target, 0), got = rows.reduce((s, r) => s + r.got, 0);
  return { rows, need, got, left: Math.max(0, need - got) };
}

function chartPoints(m) {
  const items = m.items.filter(i => num(i.debt.startBalance) > 0 || i.sim.balNow > 0);
  if (!items.length) return null;
  const minStart = items.reduce((a, i) => i.sim.start < a ? i.sim.start : a, m.today);
  const last = m.anyNever ? addDays(m.today, 365 * 5) : (m.live.reduce((a, i) => i.sim.payoff > a ? i.sim.payoff : a, m.today));
  const pts = [{ date: minStart, v: items.reduce((s, i) => s + (i.sim.start <= minStart ? num(i.debt.startBalance) : 0), 0), actual: true }];
  let [y, mo] = minStart.split('-').map(Number);
  for (let guard = 0; guard < 130; guard++) {
    if (++mo > 12) { mo = 1; y++; }
    const d = `${y}-${pad(mo)}-01`;
    if (d > addDays(last, 31)) break;
    let v = 0;
    for (const i of items) { if (d >= i.sim.start && i.sim.month[d] !== undefined) v += i.sim.month[d]; }
    pts.push({ date: d, v, actual: d <= m.today });
    if (v <= 0.005 && d > m.today) break;
  }
  if (!pts.some(p => p.date === m.today)) { pts.push({ date: m.today, v: m.total, actual: true }); pts.sort((a, b) => a.date.localeCompare(b.date)); }
  else pts.find(p => p.date === m.today).v = m.total;
  const promos = m.live.filter(i => i.debt.zeroApr && i.debt.zeroUntil && i.debt.zeroUntil > m.today).map(i => ({ date: i.debt.zeroUntil, name: i.debt.name }));
  return { pts, promos, today: m.today };
}

function paycheckCard(m, p) {
  if (!m.cycle) return `<section class="sec"><div class="card"><div class="sec-h"><h2>Set your payday</h2></div>
    <p class="note" style="margin-top:0">Tell Payoff when you get paid and it will show what to pay from each paycheck.</p>

      <div class="amt num">${money(r.remaining > 0.005 ? r.remaining : r.got, false)}<small>${tag.replace('class="tag', 'style="margin-top:2px" class="tag')}</small></div></button>`;

function promoSection(m) {

function debtMeta(it, today) {

  ${es.length ? `<div class="list" style="border-top:0">${html}</div>` : `<p class="empty">No payments yet. After you pay a bill, tap <b>Log payment</b> and the balance updates itself.</p>`}</section>`;

/* ---------- chart ---------- */
function drawChart(m) {
  const host = $('#chartHost'); if (!host) return;
  const ch = m.chart;
  if (!ch || ch.pts.length < 2) { host.innerHTML = '<p class="empty">Add a debt to see your payoff path.</p>'; return; }
  const W = Math.max(300, host.clientWidth || 640), H = Math.round(Math.min(260, W * .5)), L = 46, R = 12, T = 14, B = 26;
  const pts = ch.pts, x0 = pd(pts[0].date).getTime(), x1 = pd(pts[pts.length - 1].date).getTime();
  const maxV = Math.max(...pts.map(p => p.v)) * 1.05 || 1;
  const X = d => L + (pd(d).getTime() - x0) / (x1 - x0 || 1) * (W - L - R), Y = v => T + (1 - v / maxV) * (H - T - B);
  const nice = v => v >= 1000 ? '$' + Math.round(v / 100) / 10 + 'k' : '$' + Math.round(v);

  const proj = pts.filter(p => p.date >= ch.today), projLine = proj.map((p, i) => (i ? 'L' : 'M') + X(p.date).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const act = pts.filter(p => p.date <= ch.today), actLine = act.map((p, i) => (i ? 'L' : 'M') + X(p.date).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');

    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div></div>

    const apr = f.apr.value === '' ? 0 : parseMoney(f.apr.value), min = f.min.value === '' ? 0 : parseMoney(f.min.value), plan = f.plan.value === '' ? '' : parseMoney(f.plan.value);
    if (!(apr >= 0 && apr <= 100)) return fail('Interest rate should be between 0 and 100.');
    if (!(min >= 0) || (plan !== '' && !(plan >= 0))) return fail('Payments need to be numbers.');
    const zero = f.zero.checked;
    const debt = { ...(old || { id: uid('d'), startBalance: Math.round(bal * 100) / 100, startDate: todayStr(), archived: false, sort: Date.now() % 1e9, createdAt: new Date().toISOString() }),
      name: f.name.value.trim(), description: f.description.value.trim(), apr, minPayment: min, dueDay: f.due.value === '' ? '' : +f.due.value, zeroApr: zero, zeroUntil: zero ? f.until.value : '', plan };
    const ops = [{ type: 'upsertDebt', debt }];
    if (old) { const cur = buildModel().items.find(i => i.debt.id === id).sim.balNow; if (Math.abs(cur - bal) > 0.004) ops.push({ type: 'addEntry', entry: { id: uid('e'), debtId: id, date: todayStr(), kind: 'sync', amount: Math.round(bal * 100) / 100, note: 'Balance edited', createdAt: new Date().toISOString() } }); }
    closeSheet(); commit(ops);
    if (!old) toast(`${debt.name} added`);
  }
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
render();
if (cfg) flush();
</script>
